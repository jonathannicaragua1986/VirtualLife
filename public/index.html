<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRTUAL LIFE - Centro de Realidad Virtual | VR Experience</title>

    <!-- SEO Meta Tags -->

        content="VIRTUAL LIFE: El centro de Realidad Virtual más avanzado. Free Roam Arena sin cables, VR Stations con +50 juegos. Cumpleaños, eventos corporativos y experiencias únicas.">

        content="realidad virtual, VR, virtual reality, gaming, cumpleaños VR, eventos corporativos, Meta Quest 3">

    <!-- Security Headers via Meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM (Production) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <!-- Babel -->

    <style>
        /* Estilos personalizados para scrollbar oculta y animaciones */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.8s ease-out forwards;
        }

        /* Skip to content for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #06b6d4;
            color: black;
            padding: 8px 16px;
            z-index: 100;
            transition: top 0.3s;
        }

        .skip-link:focus {
            top: 0;
        }
    </style>
</head>

<body class="bg-[#0a0a0a]">
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONOS SVG INTEGRADOS ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        // Iconos individuales
        const Menu = (props) => <IconWrapper {...props}><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></IconWrapper>;
        const X = (props) => <IconWrapper {...props}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></IconWrapper>;
        const Users = (props) => <IconWrapper {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></IconWrapper>;
        const Zap = (props) => <IconWrapper {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></IconWrapper>;
        const ChevronRight = (props) => <IconWrapper {...props}><path d="m9 18 6-6-6-6" /></IconWrapper>;
        const Star = (props) => <IconWrapper {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></IconWrapper>;
        const Gamepad2 = (props) => <IconWrapper {...props}><line x1="6" x2="10" y1="12" y2="12" /><line x1="8" x2="8" y1="10" y2="14" /><line x1="15" x2="15.01" y1="13" y2="13" /><line x1="18" x2="18.01" y1="11" y2="11" /><rect width="20" height="12" x="2" y="6" rx="2" /></IconWrapper>;
        const Ghost = (props) => <IconWrapper {...props}><path d="M9 10h.01" /><path d="M15 10h.01" /><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z" /></IconWrapper>;
        const Crosshair = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><line x1="22" x2="18" y1="12" y2="12" /><line x1="6" x2="2" y1="12" y2="12" /><line x1="12" x2="12" y1="6" y2="2" /><line x1="12" x2="12" y1="22" y2="18" /></IconWrapper>;
        const Music = (props) => <IconWrapper {...props}><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></IconWrapper>;
        const Smile = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><path d="M8 14s1.5 2 4 2 4-2 4-2" /><line x1="9" x2="9.01" y1="9" y2="9" /><line x1="15" x2="15.01" y1="9" y2="9" /></IconWrapper>;
        const Monitor = (props) => <IconWrapper {...props}><rect width="20" height="14" x="2" y="3" rx="2" /><line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" /></IconWrapper>;
        const Calendar = (props) => <IconWrapper {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></IconWrapper>;
        const Gift = (props) => <IconWrapper {...props}><rect x="3" y="8" width="18" height="4" rx="1" /><path d="M12 8v13" /><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" /><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5" /></IconWrapper>;
        const CreditCard = (props) => <IconWrapper {...props}><rect width="20" height="14" x="2" y="5" rx="2" /><line x1="2" x2="22" y1="10" y2="10" /></IconWrapper>;
        const HelpCircle = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /></IconWrapper>;
        const ChevronDown = (props) => <IconWrapper {...props}><path d="m6 9 6 6 6-6" /></IconWrapper>;
        const MapPin = (props) => <IconWrapper {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></IconWrapper>;
        const Phone = (props) => <IconWrapper {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" /></IconWrapper>;
        const Mail = (props) => <IconWrapper {...props}><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></IconWrapper>;
        const Instagram = (props) => <IconWrapper {...props}><rect width="20" height="20" x="2" y="2" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" x2="17.51" y1="6.5" y2="6.5" /></IconWrapper>;
        const Facebook = (props) => <IconWrapper {...props}><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" /></IconWrapper>;
        const Cpu = (props) => <IconWrapper {...props}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M15 2v2" /><path d="M15 20v2" /><path d="M2 15h2" /><path d="M2 9h2" /><path d="M20 15h2" /><path d="M20 9h2" /><path d="M9 2v2" /><path d="M9 20v2" /></IconWrapper>;
        const Wifi = (props) => <IconWrapper {...props}><path d="M5 12.55a11 11 0 0 1 14.08 0" /><path d="M1.42 9a16 16 0 0 1 21.16 0" /><path d="M8.53 16.11a6 6 0 0 1 6.95 0" /><line x1="12" y1="20" x2="12.01" y2="20" /></IconWrapper>;
        const MessageCircle = (props) => <IconWrapper {...props}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></IconWrapper>;
        const Send = (props) => <IconWrapper {...props}><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></IconWrapper>;
        const Bot = (props) => <IconWrapper {...props}><path d="M12 8V4H8" /><rect width="16" height="12" x="4" y="8" rx="2" /><path d="M2 14h2" /><path d="M20 14h2" /><path d="M15 13v2" /><path d="M9 13v2" /></IconWrapper>;

        // --- COMPONENTE LOGO INTELIGENTE (Soluciona el problema de la imagen) ---
        const SmartLogo = ({ size = "w-14 h-14 md:w-16 md:h-16" }) => {
            const [src, setSrc] = useState("image_02a7fd.jpg"); // Intento 1
            const [errorCount, setErrorCount] = useState(0);
            const [hasError, setHasError] = useState(false);

            const handleError = () => {
                if (errorCount === 0) {
                    // Si falla .jpg, intentamos .jpg.png (común en Windows con extensiones ocultas)
                    setSrc("image_02a7fd.jpg.png");
                    setErrorCount(1);
                } else if (errorCount === 1) {
                    // Si falla eso, intentamos solo .png
                    setSrc("image_02a7fd.png");
                    setErrorCount(2);
                } else {
                    // Si todo falla, mostramos el icono
                    setHasError(true);
                }
            };

            if (hasError) {
                return (
                    <div className={`relative ${size} bg-black border border-cyan-400 p-2 rounded-full flex items-center justify-center`}>
                        <Users className="text-cyan-400" size={24} />
                    </div>
                );
            }

            return (
                <div className="relative group cursor-pointer">
                    <div className="absolute inset-0 bg-cyan-500 blur-xl opacity-20 group-hover:opacity-40 transition-opacity rounded-full"></div>
                    <img
                        src={src}
                        alt="VIRTUAL LIFE Logo"
                        className={`relative ${size} rounded-full border-2 border-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.3)] object-cover bg-black`}
                        onError={handleError}
                    />
                </div>
            );
        };

        // --- COMPONENTE CHATBOT CON PERSONALIDAD HUMANA (v2.0) ---
        const ChatBot = ({ openWhatsApp }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [chatState, setChatState] = useState('closed'); // closed, connecting, connected
            const [messages, setMessages] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [retryCount, setRetryCount] = useState(0);
            const messagesEndRef = useRef(null);
            const inputRef = useRef(null);
            const messagesRef = useRef([]); // Persistir mensajes entre aperturas
            const hasConnectedRef = useRef(false);

            // Información del agente
            const agent = {
                name: 'María',
                role: 'Servicio al Cliente',
                image: 'maria-agente.png'
            };

            // Scroll automático al último mensaje
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            // Sincronizar ref con estado
            useEffect(() => {
                messagesRef.current = messages;
            }, [messages]);

            // Efecto de conexión al abrir el chat
            useEffect(() => {
                if (isOpen && chatState === 'closed') {
                    // Si ya se conectó antes, restaurar mensajes existentes
                    if (hasConnectedRef.current && messagesRef.current.length > 0) {
                        setChatState('connected');
                        setMessages(messagesRef.current);
                        return;
                    }

                    setChatState('connecting');
                    setTimeout(() => {
                        setChatState('connected');
                        hasConnectedRef.current = true;
                        const hour = new Date().getHours();
                        let greeting = 'Buenas tardes';
                        if (hour < 12) greeting = 'Buenos días';
                        if (hour >= 19) greeting = 'Buenas noches';

                        setMessages([{
                            type: 'bot',
                            text: `¡${greeting}! Soy María, del equipo de Virtual Life. ¿En qué puedo ayudarte hoy?`
                        }]);
                    }, 1800);
                }
            }, [isOpen]);

            // Enfocar input al conectar
            useEffect(() => {
                if (chatState === 'connected' && inputRef.current) {
                    setTimeout(() => inputRef.current?.focus(), 100);
                }
            }, [chatState]);

            // Cerrar chat (preservar mensajes)
            const handleClose = () => {
                setIsOpen(false);
                setChatState('closed');
                // NO reseteamos messages para que persistan
            };

            // Enviar mensaje - función central que acepta texto directo
            const sendMessage = async (text) => {
                const msgText = (text || inputValue || '').trim();
                if (!msgText || chatState !== 'connected' || isTyping) return;

                const userMessage = { type: 'user', text: msgText };
                const updatedMessages = [...messages, userMessage];
                setMessages(updatedMessages);
                setInputValue('');
                setIsTyping(true);

                // Función para intentar enviar con reintento
                const attemptSend = async (attempt = 1) => {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 30000);

                        const response = await fetch('/api/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: msgText,
                                history: updatedMessages.slice(-15)
                            }),
                            signal: controller.signal
                        });

                        clearTimeout(timeoutId);

                        if (response.status === 429) {
                            return { text: 'Estoy recibiendo muchos mensajes en este momento. Esperá un momentito y volvé a intentar. 😊', source: 'rate-limit' };
                        }

                        if (!response.ok) {
                            if (attempt < 2) {
                                await new Promise(r => setTimeout(r, 1500));
                                return attemptSend(attempt + 1);
                            }
                            throw new Error('Error del servidor: ' + response.status);
                        }

                        const data = await response.json();
                        return { text: data.response, source: data.source };

                    } catch (error) {
                        if (error.name === 'AbortError') {
                            if (attempt < 2) {
                                return attemptSend(attempt + 1);
                            }
                            return { text: 'Disculpa, la respuesta está tardando más de lo normal. Intentá de nuevo en un momento o escríbenos al WhatsApp +505 7554-4500.', source: 'timeout' };
                        }
                        if (attempt < 2) {
                            await new Promise(r => setTimeout(r, 1000));
                            return attemptSend(attempt + 1);
                        }
                        return { text: 'Disculpa, estoy teniendo un problema de conexión. Para atenderte al instante, escríbenos por WhatsApp al +505 7554-4500. ¡Gracias por tu paciencia!', source: 'error' };
                    }
                };

                const result = await attemptSend();

                // Si la IA menciona WhatsApp y el usuario confirmó, abrir enlace
                if (result.text.toLowerCase().includes('whatsapp') && msgText.toLowerCase().match(/^(si|sí|ok|dale|claro|va|vamos|listo)$/)) {
                    setTimeout(() => {
                        openWhatsApp('Hola! Me atiende María en el chat. Quiero reservar una sesión de VR');
                    }, 1500);
                }

                setMessages(prev => [...prev, { type: 'bot', text: result.text, source: result.source }]);
                setIsTyping(false);
                setRetryCount(0);

                // Re-enfocar input
                setTimeout(() => inputRef.current?.focus(), 100);
            };

            // Mantener compatibilidad con handleSend para el botón
            const handleSend = () => sendMessage();

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            };

            // Enviar opción rápida directamente
            const handleQuickOption = (opt) => {
                if (isTyping) return;
                sendMessage(opt);
            };

            // Opciones rápidas
            const quickOptions = ['Precios', 'Horarios', 'Juegos', 'Reservar'];

            // Indicador de fuente de IA
            const getSourceBadge = (source) => {
                if (!source || source === 'local' || source === 'error') return null;
                const labels = { gemini: '✨ IA', grok: '✨ IA', 'rate-limit': '⏳', timeout: '⏳' };
                return labels[source] || null;
            };

            return (
                <>
                    {/* Botón flotante del chat */}
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className={`fixed bottom-6 right-6 z-50 w-16 h-16 rounded-full shadow-2xl flex items-center justify-center transition-all duration-300 hover:scale-110 ${isOpen ? 'bg-red-500 hover:bg-red-600' : 'bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500'}`}
                        aria-label={isOpen ? 'Cerrar chat' : 'Abrir chat'}
                    >
                        {isOpen ? <X size={28} className="text-white" /> : <MessageCircle size={28} className="text-white" />}
                        {!isOpen && (
                            <>
                                <span className="absolute -top-1 -right-1 w-4 h-4 bg-green-500 rounded-full animate-pulse border-2 border-white"></span>
                                <span className="absolute -top-8 right-0 bg-black/80 text-white text-xs px-2 py-1 rounded-lg whitespace-nowrap animate-bounce">
                                    ¿Necesitas ayuda?
                                </span>
                            </>
                        )}
                    </button>

                    {/* Ventana del chat */}
                    {isOpen && (
                        <div className="fixed bottom-24 right-6 z-50 w-[380px] max-w-[calc(100vw-48px)] bg-[#111] border border-white/10 rounded-2xl shadow-2xl overflow-hidden animate-fade-in-up">
                            {/* Header con foto del agente */}
                            <div className="bg-gradient-to-r from-cyan-600 to-purple-600 p-4 flex items-center gap-3">
                                <div className="relative">
                                    <img
                                        src={agent.image}
                                        alt={agent.name}
                                        className="w-12 h-12 rounded-full border-2 border-white object-cover"
                                        onError={(e) => { e.target.style.display = 'none'; }}
                                    />
                                    <span className="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></span>
                                </div>
                                <div className="flex-1">
                                    <h3 className="text-white font-bold">{agent.name}</h3>
                                    <p className="text-white/70 text-xs">{agent.role} • Virtual Life</p>
                                </div>
                                <button onClick={handleClose} className="text-white/70 hover:text-white transition-colors" aria-label="Cerrar chat">
                                    <X size={20} />
                                </button>
                            </div>

                            {/* Estado de conexión */}
                            {chatState === 'connecting' && (
                                <div className="h-80 flex flex-col items-center justify-center bg-[#0a0a0a] gap-4">
                                    <img
                                        src={agent.image}
                                        alt={agent.name}
                                        className="w-20 h-20 rounded-full border-4 border-cyan-500 object-cover animate-pulse"
                                        onError={(e) => { e.target.style.display = 'none'; }}
                                    />
                                    <div className="text-center">
                                        <p className="text-white font-semibold">Conectando con {agent.name}...</p>
                                        <p className="text-gray-400 text-sm">Servicio al Cliente</p>
                                    </div>
                                    <div className="flex gap-1">
                                        <span className="w-2 h-2 bg-cyan-500 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                                        <span className="w-2 h-2 bg-cyan-500 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                                        <span className="w-2 h-2 bg-cyan-500 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                                    </div>
                                </div>
                            )}

                            {/* Mensajes - solo cuando está conectado */}
                            {chatState === 'connected' && (
                                <>
                                    <div className="h-80 overflow-y-auto p-4 space-y-4 scrollbar-hide bg-[#0a0a0a]">
                                        {messages.map((msg, idx) => (
                                            <div key={idx} className={`flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'} gap-2`}>
                                                {msg.type === 'bot' && (
                                                    <img
                                                        src={agent.image}
                                                        alt={agent.name}
                                                        className="w-8 h-8 rounded-full object-cover flex-shrink-0"
                                                        onError={(e) => { e.target.style.display = 'none'; }}
                                                    />
                                                )}
                                                <div className="flex flex-col gap-0.5 max-w-[75%]">
                                                    <div className={`p-3 rounded-2xl text-sm whitespace-pre-wrap ${msg.type === 'user' ? 'bg-cyan-600 text-white rounded-br-sm' : 'bg-white/10 text-gray-200 rounded-bl-sm'}`}>
                                                        {msg.text}
                                                    </div>
                                                    {msg.type === 'bot' && getSourceBadge(msg.source) && (
                                                        <span className="text-[10px] text-gray-600 ml-1">{getSourceBadge(msg.source)}</span>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                        {isTyping && (
                                            <div className="flex justify-start gap-2">
                                                <img
                                                    src={agent.image}
                                                    alt={agent.name}
                                                    className="w-8 h-8 rounded-full object-cover flex-shrink-0"
                                                    onError={(e) => { e.target.style.display = 'none'; }}
                                                />
                                                <div className="bg-white/10 p-3 rounded-2xl rounded-bl-sm">
                                                    <div className="flex gap-1 items-center">
                                                        <span className="text-gray-400 text-xs mr-2">María está escribiendo</span>
                                                        <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                                                        <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                                                        <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                        <div ref={messagesEndRef} />
                                    </div>

                                    {/* Opciones rápidas */}
                                    <div className="px-4 py-2 flex gap-2 overflow-x-auto scrollbar-hide border-t border-white/5">
                                        {quickOptions.map((opt, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleQuickOption(opt)}
